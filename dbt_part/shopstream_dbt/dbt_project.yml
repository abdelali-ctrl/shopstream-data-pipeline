name: 'shopstream_dbt'
version: '2.0.0'
config-version: 2

profile: 'shopstream_dbt'

# File paths
model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================
# Models
# ============================================================
# Three layers, each in its own Snowflake schema:
#   staging  -> views (cheap, refresh on every run)
#   core     -> tables (dim_*, fact_*)
#   marts    -> tables (mart_*)
#
# generate_schema_name macro is overridden in macros/ so the
# physical schema names match the labels here exactly.

models:
  shopstream_dbt:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts

# ============================================================
# Seeds
# ============================================================
seeds:
  shopstream_dbt:
    +schema: core
    product_margins:
      +column_types:
        product_category: varchar(100)
        gross_margin_rate: decimal(4,2)

# ============================================================
# Project-wide variables
# ============================================================
vars:
  start_date: '2022-01-01'
  premium_plans: ['premium', 'enterprise']
